# Portainer Git-backed Compose stack.
# Builds the Laravel image locally on the Portainer Docker endpoint; no registry is used.
# Portainer Stack -> Environment variables are passed through explicitly below.
x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-AIReadyAssessment}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://app.aireadyassessment.com}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_STACK: ${LOG_STACK:-stderr}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-aireadyassessment}
  DB_USERNAME: ${DB_USERNAME:-aireadyassessment}
  DB_PASSWORD: ${DB_PASSWORD:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  CACHE_STORE: ${CACHE_STORE:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  FRONTEND_URL: ${FRONTEND_URL:-https://aireadyassessment.com}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://aireadyassessment.com}
  AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-cloudflare-ai-gateway}
  AI_FALLBACK_CHAT_COMPLETIONS_URL: ${AI_FALLBACK_CHAT_COMPLETIONS_URL:-}
  AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-fallback-provider}
  AI_INPUT_PRICE_PER_MILLION_USD: ${AI_INPUT_PRICE_PER_MILLION_USD:-}
  AI_OUTPUT_PRICE_PER_MILLION_USD: ${AI_OUTPUT_PRICE_PER_MILLION_USD:-}
  AI_FALLBACK_INPUT_PRICE_PER_MILLION_USD: ${AI_FALLBACK_INPUT_PRICE_PER_MILLION_USD:-}
  AI_FALLBACK_OUTPUT_PRICE_PER_MILLION_USD: ${AI_FALLBACK_OUTPUT_PRICE_PER_MILLION_USD:-}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1800}
  AI_DAILY_SPEND_LIMIT_USD: ${AI_DAILY_SPEND_LIMIT_USD:-5.00}
  AI_ENFORCE_SPEND_LIMIT: ${AI_ENFORCE_SPEND_LIMIT:-true}
  ASSESSMENT_MAX_UPLOAD_KB: ${ASSESSMENT_MAX_UPLOAD_KB:-10240}
  ASSESSMENT_MAX_TEXT_CHARS: ${ASSESSMENT_MAX_TEXT_CHARS:-30000}
  ASSESSMENT_MIN_JOB_DESCRIPTION_CHARS: ${ASSESSMENT_MIN_JOB_DESCRIPTION_CHARS:-80}
  ASSESSMENT_STATUS_TOKEN_TTL_DAYS: ${ASSESSMENT_STATUS_TOKEN_TTL_DAYS:-7}
  DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS:-30}
  INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-AIReadyAssessment Admin}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@aireadyassessment.com}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  MCP_ENABLED: ${MCP_ENABLED:-false}
  MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}

services:
  api:
    image: aireadyassessment-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_key:/run/app-key:ro
    networks:
      - backend
      - proxy
    expose:
      - "8000"
    command: ["sh", "-lc", "frankenphp php-cli artisan config:cache && frankenphp php-cli artisan view:cache && frankenphp php-cli artisan event:cache && exec frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8000); exit($$s?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  setup:
    image: aireadyassessment-api:local
    restart: "no"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - app_key:/run/app-key
    command: ["/usr/local/bin/alamia-setup"]

  worker:
    image: aireadyassessment-api:local
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_key:/run/app-key:ro
    networks:
      - backend
    command: ["frankenphp", "php-cli", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]

  scheduler:
    image: aireadyassessment-api:local
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_key:/run/app-key:ro
    networks:
      - backend
    command: ["sh", "-lc", "while :; do frankenphp php-cli artisan schedule:run --no-interaction; sleep 60; done"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aireadyassessment}
      POSTGRES_USER: ${POSTGRES_USER:-aireadyassessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aireadyassessment} -d ${POSTGRES_DB:-aireadyassessment}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_key:
  postgres_data:
  redis_data:
  app_storage:

networks:
  backend:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-alamia-network}

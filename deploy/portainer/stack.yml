# Portainer standalone Docker Compose stack.
# API image is built and published by .github/workflows/publish-api-image.yml.
# Keep passwords in Portainer stack environment variables; keep AI/API secrets in
# /opt/aireadyassessment/.env on the Docker host (chmod 600).
services:
  api:
    image: \${API_IMAGE:?Set API_IMAGE to ghcr.io/alamiasoft/aireadyassessment-api:latest}
    restart: unless-stopped
    env_file:
      - /opt/aireadyassessment/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: \${POSTGRES_DB:-aireadyassessment}
      DB_USERNAME: \${POSTGRES_USER:-aireadyassessment}
      DB_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: \${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
      FILESYSTEM_DISK: local
      SESSION_SECURE_COOKIE: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - proxy
    expose:
      - "8000"
    command: ["sh", "-lc", "php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=8000"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8000); exit($$s?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: \${API_IMAGE:?Set API_IMAGE to ghcr.io/alamiasoft/aireadyassessment-api:latest}
    restart: unless-stopped
    env_file:
      - /opt/aireadyassessment/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: \${POSTGRES_DB:-aireadyassessment}
      DB_USERNAME: \${POSTGRES_USER:-aireadyassessment}
      DB_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: \${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
      FILESYSTEM_DISK: local
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]

  scheduler:
    image: \${API_IMAGE:?Set API_IMAGE to ghcr.io/alamiasoft/aireadyassessment-api:latest}
    restart: unless-stopped
    env_file:
      - /opt/aireadyassessment/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: \${POSTGRES_DB:-aireadyassessment}
      DB_USERNAME: \${POSTGRES_USER:-aireadyassessment}
      DB_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: \${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
      FILESYSTEM_DISK: local
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    command: ["sh", "-lc", "while :; do php artisan schedule:run --no-interaction; sleep 60; done"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${POSTGRES_DB:-aireadyassessment}
      POSTGRES_USER: \${POSTGRES_USER:-aireadyassessment}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \${POSTGRES_USER:-aireadyassessment} -d \${POSTGRES_DB:-aireadyassessment}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: \${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_bootstrap_cache:

networks:
  # Non-internal so app/queue can make outbound requests to the configured AI APIs.
  # No ports are published for PostgreSQL or Redis.
  backend:
    driver: bridge
  proxy:
    # Create this network in Portainer first; attach the Cloudflare Tunnel/reverse proxy.
    external: true
    name: \${PROXY_NETWORK:-proxy}

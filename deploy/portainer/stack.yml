# Portainer Git-backed Compose stack.
# The API image is built on the Oracle VPS; no GHCR login or image publishing is required.
# Portainer Stack -> Environment variables should load the completed .env template.
services:
  api:
    image: ${API_IMAGE:-aireadyassessment-api:local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - backend
      - proxy
    expose:
      - "8000"
    command: ["sh", "-lc", "frankenphp php-cli artisan config:cache && frankenphp php-cli artisan view:cache && frankenphp php-cli artisan event:cache && exec frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",8000); exit($$s?0:1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  setup:
    image: ${API_IMAGE:-aireadyassessment-api:local}
    restart: "no"
    env_file:
      - stack.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    command:
      - sh
      - -lc
      - |
        set -eu
        test -n "$$APP_KEY" || { echo "APP_KEY is required; set it in Portainer."; exit 1; }
        frankenphp php-cli artisan migrate --force
        frankenphp php-cli artisan db:seed --force

  worker:
    image: ${API_IMAGE:-aireadyassessment-api:local}
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - backend
    command: ["frankenphp", "php-cli", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]

  scheduler:
    image: ${API_IMAGE:-aireadyassessment-api:local}
    restart: unless-stopped
    env_file:
      - stack.env
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
    networks:
      - backend
    command: ["sh", "-lc", "while :; do frankenphp php-cli artisan schedule:run --no-interaction; sleep 60; done"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aireadyassessment}
      POSTGRES_USER: ${POSTGRES_USER:-aireadyassessment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aireadyassessment} -d ${POSTGRES_DB:-aireadyassessment}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-lc", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  app_storage:

networks:
  # Allows outbound AI provider calls. No database or Redis ports are published.
  backend:
    driver: bridge
  proxy:
    # Must already exist and be shared with the Cloudflare Tunnel/reverse proxy.
    external: true
    name: ${PROXY_NETWORK:-proxy}

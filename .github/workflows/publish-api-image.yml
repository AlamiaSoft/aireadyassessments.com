name: Publish API image

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.dockerignore'
      - '.github/workflows/publish-api-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP for Composer dependency locking
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, intl, mbstring, pcntl, pdo_pgsql, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:v2

      - name: Generate and commit the initial Composer lock file
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/api/composer.lock ]; then
            mkdir -p apps/api/bootstrap/cache apps/api/storage/framework/cache/data apps/api/storage/framework/sessions apps/api/storage/framework/views apps/api/storage/logs apps/api/storage/app/private
            composer update --working-dir=apps/api --no-interaction --prefer-dist --no-progress
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/api/composer.lock
            git commit -m "build(deps): lock Laravel API dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            composer validate --working-dir=apps/api --strict
          fi

      - name: Record exact source revision for the image tag
        id: source-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alamiasoft/aireadyassessment-api
          tags: |
            type=raw,value=sha-${{ steps.source-revision.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

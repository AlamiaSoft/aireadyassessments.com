name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Docs and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no real environment files are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A real environment file appears to be tracked."
            exit 1
          fi

      - name: Verify core project documents exist
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/decisions.md
          test -f docs/oss/component-audit.md
          test -f docs/operations/observability.md
          test -f docs/operations/security-privacy.md
          test -f docs/plan/delivery-plan.md
          test -f .env.example
          test -f apps/api/.env.example

      - name: Validate Portainer Compose configuration
        shell: bash
        env:
          API_IMAGE: ghcr.io/alamiasoft/aireadyassessment-api:ci
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          PROXY_NETWORK: proxy
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/aireadyassessment
          sudo cp deploy/portainer/.env.production.example /opt/aireadyassessment/.env
          sudo chown "$(id -u):$(id -g)" /opt/aireadyassessment/.env
          chmod 600 /opt/aireadyassessment/.env
          docker compose -f deploy/portainer/stack.yml config --quiet

      - name: Check whitespace errors
        run: git diff --check
